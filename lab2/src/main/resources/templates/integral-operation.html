<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/scripts.js}" type="text/javascript"></script>
    <title>Интеграл</title>
    <style>
        body {
             font-family: "Times New Roman", serif, Times;
             font-weight: bold;
             color: #8B4513;
             background:
                     url(https://i.pinimg.com/736x/36/44/33/364433eef6aa664cb5d23c132bd3260d.jpg);
                    800px 500px;
                    repeat-y; /* Повторять изображение только по вертикали */
                     fixed; /* Зафиксировать фон */
       }


         .container {
             display: grid;
             grid-template-columns: 3fr 1fr;
             grid-template-rows: repeat(1, 1fr);
             gap: 10px;
             padding: 10px;
             font-family: "Times New Roman", serif, Times;
         }

         #flamish{
             background-color: rgba(0, 0, 0, 0);
             border-radius: 25px;
             padding: 5px;
             height: 100%;
             min-height: 94vh;
             text-align: center;
         }

         #flamishTitle{
             font-weight: bold;
             font-size: 27px;
             margin-bottom: 30px;
             margin-top: 50px;
         }

         #flamish button{
             font-family: "Times New Roman", serif, Times;
             background-color: rgba(0, 0, 0, 0);
             color: #800000;
             border: 2px solid #800000;
             border-radius: 25px;
             margin-bottom: 10px;
             width: 35%;
             height: 45px;
             font-weight: bold;
             font-size: 17px;
             text-align: center;
             cursor: pointer;
             transition: background-color 0.3s ease;

         }

         #flamish button:hover {
             background-color: #F0FFFF;
         }

         #flamish button[disabled] {
             background-color: rgba(0, 0, 0, 0); /* Серый фон для заблокированной кнопки */
             color: #DEB887;
             cursor: not-allowed; /* Указатель меняется на запрещающий значок */
             opacity: 0.6; /* Прозрачность для эффекта */
             border: 2px solid #800000;
         }

         #flamish button[disabled]:hover {
             background-color: #D3D3D3;
             color: #ffffff;
             border-color: #aaa;
         }

         #flamish table {
             width: 55%; /* Занимает всю ширину родительского контейнера */
             border-spacing: 0; /* Убирает двойные линии между ячейками */
             font-family: "Times New Roman", serif, Times;
             margin: 0 auto;
             overflow: hidden;
             border: none;
         }

         #flamish th, td {
             padding: 10px; /* Внутренние отступы */
             text-align: center; /* Текст по левому краю */
             border: 1px solid #800000; /* Светло-серая рамка */
         }

         #flamish th {
             background-color: #800000;
             color: white; /* Белый текст в заголовке */
             font-weight: bold; /* Жирный текст */
         }
         #flamish td {
             background-color: rgba(0, 0, 0, 0);
             color: #800000; /* Белый текст в заголовке */
             font-weight: bold; /* Жирный текст */
         }

         #flamish td:first-child {
             text-align: center; /* Центровка первой колонки */
         }

         #ramen{
             background-color: rgba(0, 0, 0, 0);

             padding: 5px;
             height: 100%;
             min-height: 94vh;
             text-align: center;
         }

         #ramenTitle{
             font-weight: bold;
             font-size: 27px;
             margin-bottom: 30px;
             margin-top: 50px;
         }

         #threadCount{
             width: 55%;
             height: 45px;
             border: none;
             border-radius: 5px;
             background-color: white;
             font-family: "Times New Roman", serif, Times;
             font-size: 15px;
             padding-left: 20px;
             padding-right: 15px;
             outline: none; /* Убираем обводку при фокусе */
             box-shadow: none;
             margin-bottom: 10px;
         }

         #ramen button{
             font-family: "Times New Roman", serif, Times;
             background-color: #800000;
             color: #fff;
             border: none;
             border-radius: 5px;
             margin-bottom: 10px;
             width: 130px;
             height: 45px;
             font-weight: bold;
             font-size: 16px;
             text-align: center;
             cursor: pointer;
             transition: background-color 0.3s ease;
         }

         #ramen button:hover {
             background-color: #DEB887;
         }

         #ramen button[disabled] {
             background-color: #c800000; /* Серый фон для заблокированной кнопки */
             color: #858585; /* Тусклый цвет текста */
             cursor: not-allowed; /* Указатель меняется на запрещающий значок */
             opacity: 0.6; /* Прозрачность для эффекта */
             border: none; /* Серый цвет рамки */
         }



    </style>
</head>
<body>
<div class="container">
    <div id="flamish">
        <h3 id="flamishTitle">Функция</h3>
        <button onclick="openModal('integral','integral')">Создать функцию</button>
        <button onclick="openSave('integral')" th:attr="disabled=${integralFunc == null}">Сохранить</button>
        <button onclick="openFunctionList('integral')">Загрузить</button>
        <button onclick="openAnother('integral','integral')">Создать сложную функцию</button>
        <button onclick="openEdit('integral','integral')" th:attr="disabled=${integralFunc == null}">Вставить или изменить</button>
        <button onclick="openRemove('integral','integral')" th:attr="disabled=${integralFunc == null or countOfIntegral == 2 }">Удалить точку</button>
        <div id="integralContent">
            <div th:if="${integralFunc != null}">
                <h4>Таблица функции:</h4>
                <table border="1">
                    <thead>
                    <tr>
                        <th>X</th>
                        <th>Y</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="i : ${#numbers.sequence(0, countOfIntegral - 1)}">
                        <td><input type="number" th:value="${integralFunc.getXValues()[i]}" readonly></td>
                        <td><input type="number" th:value="${integralFunc.getYValues()[i]}" readonly></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${integralFunc == null}">
                <p>Функция отсутствует</p>
            </div>
        </div>
        <div>
    </div>
</div>
    <div id="ramen">
        <h4 id="ramenTitle">Результат</h4>
        <form action="/integral/calculate" method="post">
            <input type="number" id="threadCount" name="threadCount" value="1" min="1" max="100" required>
            <button type="submit" th:attr="disabled=${integralFunc == null}">Выполнить</button>
        </form>

        <div th:if="${integralResult != null}">
            <p th:text="${integralResult}"></p>
        </div>
        <div th:if="${integralResult == null}">
            <p>Нет результата</p>
        </div>
    </div>

</div>

<div th:replace="fragments/functionsModalForms"></div>

</body>
</html>
