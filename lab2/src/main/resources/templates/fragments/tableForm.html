<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        #rosa1 table {
            width: 100%;
            max-width: 600px;
            border-spacing: 0;
            border-radius: 15px;
            font-family: "Times New Roman", serif, Times;
            overflow: hidden;
            border: none;
            position: relative;
        }

        #rosa1 th, #rosa1 td {
            padding: 10px; /* Внутренние отступы */
            text-align: center; /* Текст по левому краю */
            border: 1px solid #e0e0e0; /* Светло-серая рамка */
            background-clip: padding-box;
        }

        #rosa1 th {
            background-color: #FFDEAD; /* Фон заголовка таблицы — розовый */
            color: #800000; /* Белый текст в заголовке */
            font-weight: bold; /* Жирный текст */
        }

        #rosa1 td:first-child {
            text-align: center; /* Центровка первой колонки */
        }



        button {
            padding-left: 10px;
            background-color: #FFDEAD;
            font-family: "Times New Roman", serif, Times;
            font-weight: bold;
            border: none;
            height: 40px;
            width: 130px;
            border-radius: 5px;
            color: #800000;
            cursor: pointer;
            font-size: 15px;
            margin-top: 5px;
            margin-right: 15px;
        }

        button:hover {
            background-color: #FFE4C4;
        }

        button:disabled {
            background-color: #СFFDEAD;
            cursor: not-allowed;
        }

        #closeCreateFunction{
            text-align: center;
            float: right;
            margin-top: 5px;
            margin-right: 12px;
            margin-bottom: 10px;
            background-color: #8B4513;
            color: white;
            font-family: "Times New Roman", serif, Times;
            font-weight: bold;
            font-size: 15px;
            border: none;
            border-radius: 5px;
            height: 40px;
            width: 130px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            padding-right: 10px;
        }
    </style>
</head>
<body>
<div>
    <form id="createFunctionForm" action="/arrayFunc/createFunction" method="post">
        <input type="hidden" name="target" th:value="${target}" id="targetField">
        <input type="hidden" name="redirectTarget" th:value="${redirectTarget}" id="redirectTargetField">
        <table id="rosa1">
            <tr>
                <th>X</th>
                <th>Y</th>
            </tr>
            <tr th:each="i : ${#numbers.sequence(1, points)}">
                <td><input type="number" name="x" step="0.01" required/></td>
                <td><input type="number" name="y" step="0.01" required/></td>
            </tr>
        </table>
        <button type="submit">Создать</button>
        <button id="closeCreateFunction" type="button" onclick="closeModal()">Закрыть</button>

    </form>
</div>
</body>
</html>
