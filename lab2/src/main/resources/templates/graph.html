<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/scripts.js}" type="text/javascript"></script>
    <script th:src="@{/js/graphScript.js}" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>График</title>

    <style>
        body {
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
           font-family: "Times New Roman", serif, Times;
           background:
                    url(https://i.pinimg.com/736x/a4/68/76/a468760429f10d1bd305a0e679e5c8d0.jpg)
                   350px 950px;
                   repeat-y; /* Повторять изображение только по вертикали */
                    fixed; /* Зафиксировать фон */
        }
    .container {
    display: grid;
    grid-template-columns: 1fr 2fr;
    grid-template-rows: repeat(1, 1fr);
    gap: 10px;
    padding: 10px;
    font-family: "Times New Roman", serif, Times;
    }

    #flis{
    background-color:rgba(0, 0, 0, 0);
    border-radius: 5px;
    padding: 5px;
    height: 100%;
    min-height: 94vh;
    text-align: center;
    }

    #flisTitle{
        font-weight: bold;
        font-size: 27px;
        margin-bottom: 30px;
        margin-top: 50px;
    }

    #flis button{
        font-family: "Times New Roman", serif, Times;
        background-color:rgba(0, 0, 0, 0);
        color: #800000;
        border: none;
        border-radius: 5px;
        margin-bottom: 10px;
        width: 35%;
        height: 65px;
        font-weight: bold;
        font-size: 19px;
        text-align: center;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    #flis button:hover {
        background-color: #FFF0F5;
    }

    #flis button[disabled] {
         background-color:rgba(0, 0, 0, 0); /* Серый фон для заблокированной кнопки */
        color: #ffffff; /* Тусклый цвет текста */
        cursor: not-allowed; /* Указатель меняется на запрещающий значок */
        opacity: 0.6; /* Прозрачность для эффекта */
        border: none; /* Серый цвет рамки */
    }

    #flis button[disabled]:hover {
        background-color: #FFF0F5;
        color: #ffffff;
        border-color: #aaa;
    }

    #flis table {
        width: 55%; /* Занимает всю ширину родительского контейнера */
        border-spacing: 0; /* Убирает двойные линии между ячейками */
        font-family: "Times New Roman", serif, Times;
        margin: 0 auto;
        overflow: hidden;
        border: 2px solid #808080;
    }

    #flis th, td {
        padding: 10px; /* Внутренние отступы */
        text-align: center; /* Текст по левому краю */
        border: 1px solid #e0e0e0; /* Светло-серая рамка */
    }

    #flis th {
        background-color:rgba(0, 0, 0, 0);
        color: black;
        font-weight: bold; /* Жирный текст */
    }

    #flis tr:nth-child(even) {
        background-color:rgba(0, 0, 0, 0); /* Серый фон для четных строк */
    }

    #flis tr:nth-child(odd) {
        background-color:rgba(0, 0, 0, 0); /* Белый фон для нечетных строк */
    }

    #flis td:first-child {
        text-align: center; /* Центровка первой колонки */
    }

    #flis table tr:hover {
        background-color: #f9c5f0; /* Слегка розовый цвет при наведении на строку */
    }



    #glamur{
        background-color:rgba(0, 0, 0, 0);
        border-radius: 5px;
        padding: 5px;
        height: 100%;
        min-height: 94vh;
        text-align: center;
    }

    #glamurTitle{
        font-weight: bold;
        font-size: 27px;
        margin-bottom: 30px;
        margin-top: 50px;
    }

    #xToApply{
        width: 55%;
        height: 45px;
        border: none;
        border-radius: 5px;
        background-color: white;
        font-family: "Times New Roman", serif, Times;
        font-size: 15px;
        padding-left: 20px;
        padding-right: 15px;
        outline: none; /* Убираем обводку при фокусе */
        box-shadow: none;
        margin-bottom: 10px;
    }

    #glamur button{
        font-family: "Times New Roman", serif, Times;
        background-color: #800000;
        color: white;
        border: none;
        border-radius: 5px;
        margin-bottom: 10px;
        width: 130px;
        height: 45px;
        font-weight: bold;
        font-size: 16px;
        text-align: center;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    #glamur button:hover {
        background-color: #A52A2A;
    }

    #glamur button[disabled] {
        background-color: #BC8F8F; /* Серый фон для заблокированной кнопки */
        color: #858585; /* Тусклый цвет текста */
        cursor: not-allowed; /* Указатель меняется на запрещающий значок */
        opacity: 0.6; /* Прозрачность для эффекта */
        border: none; /* Серый цвет рамки */
    }

    #glamur button[disabled]:hover {
        background-color: #D2B48C;
        color: #9c9c9c;
        border-color: #6c6c6c;
    }
    </style>
</head>
<body>
<div class="container">
    <div id="flis">
        <h3 id="flisTitle">Функция</h3>
        <button onclick="openModal('graph','graph')">Создать функцию</button>
        <button onclick="openSave('graph')" th:attr="disabled=${graphFunc == null}">Сохранить</button>
        <button onclick="openFunctionList('graph')">Загрузить</button>
        <button onclick="openAnother('graph','graph')">Создать сложную функцию</button>
        <button onclick="openEdit('graph','graph')" th:attr="disabled=${graphFunc == null}">Вставить или изменить</button>
        <button onclick="openRemove('graph','graph')" th:attr="disabled=${graphFunc == null or countGraph == 2 }">Удалить точку</button>
        <div id="graphContent">
            <div th:if="${graphFunc != null}">
                <h4>Таблица функции:</h4>
                <table border="1">
                    <thead>
                    <tr>
                        <th>X</th>
                        <th>Y</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="i : ${#numbers.sequence(0, countGraph - 1)}">
                        <td><input type="number" th:value="${graphFunc.getXValues()[i]}" readonly></td>
                        <td><input type="number" th:value="${graphFunc.getYValues()[i]}" readonly></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${graphFunc == null}">
                <p>Отсутствует функция</p>
            </div>
        </div>
    </div>
    <div id="glamur">
        <h3 id="glamurTitle">График</h3>
        <form action="/graph/apply" method="post">
            <input type="number" id="xToApply" placeholder="Введите Х" name="xToApply" required>
            <button type="submit" th:attr="disabled=${graphFunc == null}">Выполнить</button>
        </form>

    <div th:if="${graphResult != null}">
        <p th:text="${graphResult}"></p>
    </div>
    <div th:if="${graphResult == null}">
        <p>Нет результата</p>
    </div>
    <div id="functionGraphContainer">
        <canvas id="functionGraph"></canvas>
    </div>
</div>
</div>
<div th:replace="fragments/functionsModalForms"></div>

</body>
</html>
