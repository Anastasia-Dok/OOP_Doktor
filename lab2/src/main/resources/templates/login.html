<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{static/css/login.css}"/>
    <title>Вход в систему</title>
</head>
<style>
    body {

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
   font-family: "Times New Roman", serif, Times;
   background:
                    url(https://i.pinimg.com/736x/52/d5/15/52d515a1c0da7d01556122c17b7b6f86.jpg)
                   350px 950px;
                   repeat-y; /* Повторять изображение только по вертикали */
                    fixed; /* Зафиксировать фон */
                    padding-right: 100px;
}
    .login-container {
    position: relative;

    padding: 30px 40px;
    border-radius: 20px;
    color: #000;
    text-align: center;
    width: 450px;
    height: 290px;
}

.login-container h1 {
    font-size: 24px;
    margin-bottom: 30px;
}

.login-container input[type="text"],
.login-container input[type="password"] {
    width: 80%;
    padding: 15px 15px;
    margin-bottom: 15px;
    margin-right: 0px;
    border: none;
    border-radius: 2px;
    background-color: #FFF8DC;
    font-weight: normal;
    font-size: 14px;
}

.login-container label {
    display: block;
    text-align: left;
    margin-bottom: 5px;
    color: #FFEBCD;
    font-size: 16px;
}

.login-container a {
    display: block;
    text-align: center;
    margin-bottom: 10px;
    font-size: 16px;
    color: #000;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
}

.login-container a:hover {
    text-decoration: underline;
}

.login-container button {
    margin-top: 10px;
    position: static; /* Абсолютное позиционирование */
    width: 150px;
    height: 45px;
    text-align: center;
    padding: 10px;
    background-color: #8B4513;
    border: none;
    border-radius: 4px;
    font-family: "Times New Roman", serif, Times;
    font-size: 16px;
    font-weight: bold;
    color: #000;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.login-container button:hover {
    background-color: #D2B48C;
}
</style>
<body>
<div class="login-container">
    <h1>Вход в систему:</h1>
    <form action="/login" method="post">
        <label for="username"></label>
        <input type="text" id="username" name="username" placeholder="Логин" required><br>

        <label for="password"></label>
        <input type="password" id="password" name="password" placeholder="Пароль" required><br>

        <a href="/register">У меня нет аккаунта</a>
        <button type="submit">Войти</button>
    </form>
</div>
</body>
</html>
