<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/home.css}"/>
    <title>Главная</title>
</head>
<body>
<div class="main-container">
    <div class="top-row">
        <div class="basic-operations" id="basic-operations"><button onclick="window.location.href='/tabulated-operations'">Базовые операции над функциями</button></div>
        <div class="complex-function" id="complex-function"><button onclick="window.location.href='/composite'">Создание сложной функции</button></div>
        <div class="plot-graph" id="plot-graph"><button onclick="window.location.href='/graph'">Построить график</button></div>
    </div>
    <div class="bottom-row">
        <div class="differentiate-function" id="differentiate-function" onclick="window.location.href='/differential-operation'"> <button>Дифференцирование<br> функции</button></div>
        <div class="calculate-integral" id="compute-integral"><button onclick="window.location.href='/integral'">Вычисление интеграла </button></div>
        <div class="factory-settings" id="factory-settings"><button onclick="document.getElementById('settingsModal').showModal()">Настройки фабрики </button>
        </div>
    </div>
</div>
<dialog id="settingsModal">
    <form action="/settings" method="post">
        <label for="factoryType">Выберите фабрику:</label>
        <select name="factoryType" id="factoryType">
            <option value="array" ${selectedFactory == 'array' ? 'selected' : ''}>Фабрика на основе массива</option>
            <option value="linkedlist" ${selectedFactory == 'linkedlist' ? 'selected' : ''}>Фабрика на основе связного списка</option>
        </select>
        <button type="submit" id="submit">Сохранить</button>
        <button type="button" id="button" onclick="document.getElementById('settingsModal').style.display = 'none'; window.location.reload();">
            Закрыть
        </button>
    </form>
</dialog>
</body>
</html>
